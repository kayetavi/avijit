<!DOCTYPE html>
<html lang="en" class="login-html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ Preconnect & Performance Resource Hints -->
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
  <link rel="preload" href="/assets/css/style.css" as="style" />
  <link rel="preload" href="/image/refinery.jpg" as="image" />
  <link rel="preload" href="/assets/login.min.js" as="script" />

  <!-- ✅ Canonical URL -->
  <link rel="canonical" href="https://kayetdms.live/" />

  <!-- ✅ SEO Title & Meta Description -->
  <title>Kayetdms - Digital Tools | Integrity Dashboard</title>
  <meta name="description" content="KayetDMS is a web-based dashboard for managing damage mechanisms, tracking corrosion rates, calculating remaining life, and performing standard-compliant design thickness assessments for industrial equipment." />
  <meta name="keywords" content="Damage Mechanisms, Corrosion Monitoring, Remaining Life, Design Thickness, Maintenance Tools,Cracking Mechanism Finder,Risk-Based Inspection Methodology, KayetDMS" />
  <meta name="author" content="Avijit Kayet" />

  <!-- ✅ Social Media Meta -->
  <meta property="og:title" content="KayetDMS - Damage mechanism & Digital Tools" />
  <meta property="og:description" content="Digital Maintenance Dashboard for Inspection, Inventory Calculation, Damage mechanism,Inspection cofidence, Corrosion Tracking as per damage mechanism & More" />
  <meta property="og:image" content="https://kayetdms.live/image/avijitk-logo.png" />
  <meta property="og:url" content="https://kayetdms.live/" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- ✅ Favicon & Manifest -->
  <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16x16.png" />
  <link rel="manifest" href="image/site.webmanifest" />

  <!-- ✅ Primary Stylesheet -->
  <link rel="stylesheet" href="/assets/css/style.css" />


</head>
<body class="login-page">

  <div class="login-container">
    <img src="image/avijitk-logo.png" alt="KayetDMS Logo" class="logo" />
    <h2>Integrity Digital Tools</h2>

    <input type="email" id="username" placeholder="Email" required autocomplete="username" />
    <div class="password-wrapper">
      <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
      <button type="button" id="togglePasswordBtn" class="toggle-password-btn" aria-label="Show password" title="Show password">
        <svg id="eyeIcon" class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>

    <div class="login-actions">
      <a href="javascript:void(0)" id="forgotPasswordLink" class="forgot-password-link">Forgot Password?</a>
    </div>

    <button id="loginBtn">
      <span class="btn-text">Login</span>
      <div class="spinner"></div>
    </button>

    <div class="error" id="errorMsg"></div>
  </div>

  <!-- 🔹 Forgot Password Modal -->
  <div id="forgotPasswordModal" class="forgot-modal hidden" role="dialog" aria-modal="true" aria-labelledby="forgotModalTitle">
    <div class="forgot-modal-backdrop" id="forgotModalBackdrop"></div>
    <div class="forgot-modal-card">
      <button type="button" class="forgot-modal-close" id="closeForgotModalBtn" aria-label="Close modal">&times;</button>
      <div class="forgot-modal-header">
        <div class="forgot-modal-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h3 id="forgotModalTitle">Reset Password</h3>
        <p>Enter your registered email address and we'll send you instructions to reset your password.</p>
      </div>

      <form id="forgotPasswordForm" onsubmit="return false;">
        <div class="forgot-input-group">
          <label for="recoveryEmail">Email Address</label>
          <input type="email" id="recoveryEmail" placeholder="Enter your email" required autocomplete="email" />
        </div>
        
        <div id="recoveryStatus" class="recovery-status"></div>

        <div class="forgot-modal-actions">
          <button type="button" class="btn-cancel" id="cancelForgotBtn">Cancel</button>
          <button type="submit" class="btn-submit" id="sendRecoveryBtn">
            <span class="btn-text">Send Reset Link</span>
            <span class="spinner" id="recoverySpinner"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="footer-credit">
      &copy; 2025 | Created by Avijit Kayet
    </div>
  </footer>

  <!-- ✅ Defer Main Scripts for Maximum Rendering Performance -->
  <script src="/assets/login.min.js" defer></script>
</body>
</html>
