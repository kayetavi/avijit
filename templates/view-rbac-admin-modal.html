<!-- 🛡️ Admin Role-Based Access Control Modal -->
<div id="rbacAdminModal" class="rbac-modal-backdrop" style="display: none;">
  <div class="rbac-modal-card">
    <div class="rbac-modal-header">
      <h3>🛡️ Access & Roles Manager (Firebase RBAC)</h3>
      <button class="rbac-close-btn" onclick="closeRbacAdminModal()" type="button" aria-label="Close">&times;</button>
    </div>
    
    <div class="rbac-modal-body">
      <div class="rbac-controls-bar">
        <div class="rbac-field-group">
          <label>Select User to Configure</label>
          <select id="rbacUserSelect" onchange="window.onRbacUserSelected(this.value)">
            <option value="">Loading users from Firebase...</option>
          </select>
        </div>

        <div class="rbac-field-group">
          <label>Assign Role Preset</label>
          <select id="rbacRoleSelect" onchange="window.onRbacRoleChanged(this.value)">
            <option value="admin">👑 Admin (Full Access to Everything)</option>
            <option value="lead_engineer">⚙️ Lead Engineer (All Engineering & Calc Modules)</option>
            <option value="inspector">🔍 Inspector (Damage Explorer, Screening & Remaining Life)</option>
            <option value="viewer">👁️ Viewer (Read-only Damage & Fluids Data)</option>
            <option value="custom">🛠️ Custom Permissions (Granular Checkboxes)</option>
          </select>
        </div>
      </div>

      <div class="rbac-field-group">
        <label>Target User Email</label>
        <input type="email" id="rbacTargetEmail" placeholder="user@company.com" />
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px;">
        <span style="font-size: 13px; font-weight: 600; color: #94a3b8;">Module & Sub-section Permissions</span>
        <span style="font-size: 12px; color: #64748b;">(Select "Custom Permissions" above to toggle individual checkboxes)</span>
      </div>

      <div id="rbacModulesContainer">
        <!-- Injected dynamically by js/rbac.js -->
      </div>
    </div>

    <div class="rbac-modal-footer">
      <span style="font-size: 12px; color: #94a3b8;">Synced real-time with Firebase Firestore.</span>
      <button id="rbacSaveBtn" class="rbac-save-btn" onclick="saveRbacPermissionsToFirebase()" type="button">
        💾 Save Permissions to Firebase
      </button>
    </div>
  </div>
</div>
